name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Optional NumPy snapshot contract
        run: |
          python -m pip install numpy
          python -m unittest discover -s tests -p test_cuda_snapshot.py -v
      - run: python -m adaptive_timing benchmark --events 60 --output reports/ci
