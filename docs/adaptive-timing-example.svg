  <g id="text_1">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b9a2ff" x="51.84" y="44.055684" transform="rotate(-0 51.84 44.055684)">ADAPTIVE TIMING ENGINE</text>
  </g>
  <g id="text_2">
   <text style="font-weight: 700; font-size: 31px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #edf4fa" x="51.84" y="94.316756" transform="rotate(-0 51.84 94.316756)">New work makes old results obsolete.</text>
  </g>
  <g id="text_3">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="51.84" y="132.5127" transform="rotate(-0 51.84 132.5127)">A controlled worker experiment keeps one calculation active and one request waiting.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="51.84" y="569.317969" transform="rotate(-0 51.84 569.317969)">Reproduced with thread gates. Schematic event order, not elapsed time or a speed benchmark.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #b5c6d3" x="1100.16" y="591.229656" transform="rotate(-0 1100.16 591.229656)">T92T1914  /  PUBLIC PROJECT EXAMPLE</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 33px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b9a2ff" x="80.64" y="219.817866" transform="rotate(-0 80.64 219.817866)">101</text>
  </g>
  <g id="text_7">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="80.64" y="259.505325" transform="rotate(-0 80.64 259.505325)">requests submitted</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 33px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b9a2ff" x="345.6" y="219.817866" transform="rotate(-0 345.6 219.817866)">2</text>
  </g>
  <g id="text_9">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="345.6" y="259.505325" transform="rotate(-0 345.6 259.505325)">calculations run</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 33px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b9a2ff" x="610.56" y="219.817866" transform="rotate(-0 610.56 219.817866)">99</text>
  </g>
  <g id="text_11">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="610.56" y="259.505325" transform="rotate(-0 610.56 259.505325)">waiting requests replaced</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 33px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b9a2ff" x="875.52" y="219.817866" transform="rotate(-0 875.52 219.817866)">1</text>
  </g>
  <g id="text_13">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="875.52" y="259.505325" transform="rotate(-0 875.52 259.505325)">obsolete result rejected</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5c6d3" x="77.184" y="364.289753" transform="rotate(-0 77.184 364.289753)">START 0</text>
  </g>
  <g id="text_15">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(77.184 408.966788)">Payload 0 starts.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(77.184 431.066788)">The experiment holds it.</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #edc57a" x="342.144" y="364.289753" transform="rotate(-0 342.144 364.289753)">REPLACE THE QUEUE</text>
  </g>
  <g id="text_17">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(342.144 408.966788)">Payloads 1 through 100 arrive.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(342.144 431.066788)">Only 100 stays waiting.</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #f299a5" x="607.104" y="364.289753" transform="rotate(-0 607.104 364.289753)">REJECT 0</text>
  </g>
  <g id="text_19">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(607.104 408.966788)">Payload 0 finishes.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(607.104 432.326163)">Its result is obsolete.</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #62dbcd" x="872.064" y="364.289753" transform="rotate(-0 872.064 364.289753)">KEEP 100</text>
  </g>
  <g id="text_21">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(872.064 408.966788)">Payload 100 runs next.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #edf4fa" transform="translate(872.064 432.326163)">The current result is retained.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #edf4fa" x="63.36" y="514.1415" transform="rotate(-0 63.36 514.1415)">The active calculation finishes safely. Its obsolete output never becomes the current result.</text>
  </g>
