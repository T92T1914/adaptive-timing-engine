[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-timing-engine"
version = "0.1.0"
description = "Adaptive event scheduling with bounded asynchronous replanning and reproducible simulation"
requires-python = ">=3.11"
authors = [{name = "Strix"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
adaptive-timing = "adaptive_timing.__main__:main"

[tool.setuptools.packages.find]
include = ["adaptive_timing*"]

[tool.setuptools.package-data]
adaptive_timing = ["viewer.html", "py.typed"]
